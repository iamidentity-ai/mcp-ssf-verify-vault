# Jekyll config for GitHub Pages.
# Pages serves the repo's markdown via Jekyll: README.md becomes the site
# landing page; docs/*.md files become /docs/<chapter>.html.

title: "Securing Your MCP Server with Shared Signals"
description: "IBM Verify + HashiCorp Vault + IBM Antenna v26.03 — a hands-on cookbook"
url: "https://iamidentity-ai.github.io/mcp-ssf-verify-vault"
repository: "iamidentity-ai/mcp-ssf-verify-vault"
theme: jekyll-theme-cayman

# Skip the noise — these are build artifacts and contributor scripts,
# not pages a customer should land on.
exclude:
  - "MCP-COOKBOOK-V*.docx"
  - scripts/
  - infra/
  - agent/
  - mcp-server/
  - .github/
  - CONTRIBUTING.md
  - "*.lock"
  - node_modules/
  - .gitignore
