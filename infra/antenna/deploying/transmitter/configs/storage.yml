---
# IBM Verify Antenna v26.03 — Transmitter storage configuration
#
# Schema reference: /tmp/verify-antenna-recipes/config/ibm-verify-antenna-config-ref.md §5 + §6
# Canonical recipe (split datastore — Postgres + Kafka):
#   /tmp/verify-antenna-recipes/deploying/transmitter/container-runtime/configs/storage.yml
#
# COOKBOOK SIMPLIFICATION:
# The canonical recipe uses Postgres for `config` + `poll_stage` and Kafka for
# `raw_2_ssf`, requiring a separate datastore docker-compose with antenna-postgres
# + antenna-kafka services + SASL/SSL/CA generation. We use SQLite for ALL four
# transmitter databases instead — the v26.03 schema explicitly permits this
# (config-ref §6.1.1: `config` supports sqlite|postgresql; §6.2.1: `raw_2_ssf`
# supports sqlite|kafka; §6.3.1: `ssf_2_set` is sqlite-only anyway; §6.5.1:
# `poll_stage` is sqlite-only). Single-file SQLite at /db/transmitter.db keeps
# laptop deployment to two containers (transmitter + receiver) instead of four.
#
# v26.03 invariants:
#   - `version: 26.03` MUST be the first key
#   - `keystores`, `server_connections`, `databases` are TOP-LEVEL keys (the
#     v25.05 `storage:` wrapper does NOT exist in v26.03)
#   - SQLite `hosts[].hostname` uses the SQLite URI form `file:///...?cache=shared`
#     and `hostport: 0` (it's a file, no real port)
version: 26.03

keystores:
  # The HTTPS server cert for the transmitter's listener on :9044.
  # Cert files live at deploying/transmitter/configs/keys/server.{pem,key},
  # generated by generate-certs.sh.
  - name: server
    type: pem
    certificate:
      - label: cert
        content: "@keys/server.pem"
    key:
      - label: key
        content: "@keys/server.key"

  # The JWT signing key used by the transmitter to sign Security Event Tokens
  # (SETs) before they leave for the receiver. Referenced by
  # transmitter.runtime.jwks.signing_keystore in transmitter.yml.
  - name: jwks_keys
    type: pem
    certificate:
      - label: jwtsigner
        content: "@keys/jwtsigner.pem"
    key:
      - label: jwtsigner
        content: "@keys/jwtsigner.key"

server_connections:
  # Single SQLite "server" backing all four transmitter databases. The four
  # databases below (config, raw_2_ssf, ssf_2_set, poll_stage) all point at
  # this name; SQLite namespaces them as tables within /db/transmitter.db.
  - name: sqlitefile
    type: sqlite
    database_name: antenna
    hosts:
      - hostname: "file:///db/transmitter.db?cache=shared"
        hostport: 0

databases:
  # Stream configuration storage (the receiver's subscription record).
  # Shared between transmitter and receiver in a production deployment via
  # Postgres; in the cookbook each role gets its own SQLite file. The
  # stream-config row is created by the receiver via POST /mgmt/v2.0/.../config
  # and persisted on the TRANSMITTER's `config` db (the receiver's config db
  # holds its own subscription record).
  config:
    server: sqlitefile

  # Raw events arrive on /sources/<id>/events and are queued here pending
  # transform. Worker_threads in transmitter.yml MUST be <= partitions.
  raw_2_ssf:
    server: sqlitefile
    partitions: 1

  # SSF-shaped JSON awaiting JWT signing (becomes a SET). SQLite-only per the
  # v26.03 schema.
  ssf_2_set:
    server: sqlitefile
    partitions: 1

  # Signed SETs awaiting receiver poll. SQLite-only per the v26.03 schema.
  # retention_time_in_days bounds the staleness window the receiver tolerates;
  # cookbook value is 4 days (recipe default 7).
  poll_stage:
    server: sqlitefile
    retention_time_in_days: 4
